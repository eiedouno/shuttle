copyright = "Made by real humans with Zensical"

repo_url = "https://github.com/eiedouno/shuttle"
repo_name = "eiedouno/shuttle"
# edit_uri = "edit/main/docs/"

nav = [
    { "Shuttle Documentation" = [
        { "Home" = "index.md" },
        { "Getting Started" = [
            { "Installation" = "startup/installation.md" },
            { "Using Shuttle" = "startup/usage.md" },
        ] },
        { "Resources" = [
            { "FAQ" = "FAQ.md" },
            { "Contributing" = "contributing.md" },
            { "Change Log" = "changelog.md" },
        ] },
    ] },

    { "Shuttle Script Dev Docs" = [
        { "Developing with Shuttle" = "developing/index.md" },
        { "Getting Started" = [
            { "Master Tutorial" = "developing/tutorial/index.md" },
            { "Creating a Project" = "developing/tutorial/creating_a_project.md" },
            { "Sourcing Files" = "developing/tutorial/sourcing.md" },
            { "Special Folders" = "developing/concept/special.md" },
        ] },
        { "Concepts" = [
            { "Installing" = "developing/concept/installing.md" },
            { "shuttle.json" = "developing/concept/json_config.md" },
            { "Building" = "developing/concept/building.md" },
            { "Sourcing" = "developing/concept/sourcing.md" },
            { "Special Folders" = "developing/concept/special.md" },
        ] },
        { "Resources" = [
            { "FAQ" = "developing/FAQ.md" },
        ] },
    ] },

    { "Shuttle Technical Docs" = [
        { "Technical Documentation" = "tech/index.md" },
        { "How it works" = [
            { "Building" = "tech/how/building.md" },
        ] },
    ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
    "announce.dismiss",
    # "content.action.edit",
    # "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    # "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    # "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    # "toc.follow",
    # "toc.integrate",
]

# logo = "assets/logo.png"

[project.theme.icon]
repo = "fontawesome/brands/github"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/eiedouno/shuttle"
name = "Repo"

[project.extra]
generator = false

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
